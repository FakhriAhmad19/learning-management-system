name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Push beruntun pada branch yang sama: batalkan run lama, jalankan yang terbaru
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Test dijalankan di dalam stack Docker proyek ini, bukan di lingkungan
      # yang disusun ulang oleh runner.
      #
      # Alasannya konkret: perintah backup:database memanggil `mysqldump`, dan
      # opsi TLS-nya berbeda antara klien MariaDB (dipakai image proyek) dan
      # klien Oracle. Menyusun ulang lingkungan di runner membuat CI menguji
      # kombinasi yang berbeda dari yang benar-benar dijalankan di produksi.
      # Dengan cara ini CI memakai image, klien, dan MySQL yang sama persis
      # dengan perintah yang didokumentasikan di README.
      - name: Bangun dan jalankan stack Docker
        run: docker compose up -d --build --renew-anon-volumes

      - name: Tunggu aplikasi siap
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/up > /dev/null 2>&1; then
              echo "Aplikasi siap."
              exit 0
            fi
            sleep 5
          done
          echo "Aplikasi tidak siap dalam batas waktu." >&2
          docker compose logs --tail 50
          exit 1

      - name: Jalankan test
        run: docker compose exec -T app php artisan test

      - name: Tampilkan log bila gagal
        if: failure()
        run: docker compose logs --tail 100

  lint:
    name: Laravel Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Pasang dependensi Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Periksa gaya kode
        run: ./vendor/bin/pint --test
