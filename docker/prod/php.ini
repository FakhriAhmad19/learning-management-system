; Konfigurasi PHP untuk produksi.

; Jangan pernah menampilkan error ke pengunjung — detailnya cukup ke log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

memory_limit = 256M
max_execution_time = 60

; Selaras dengan client_max_body_size di nginx dan batas 10 MB pada
; pengumpulan tugas (post_max_size harus lebih besar dari upload_max_filesize).
upload_max_filesize = 10M
post_max_size = 12M

; OPcache: wajib untuk produksi.
; validate_timestamps=0 berarti PHP tidak mengecek perubahan berkas —
; kode di-cache permanen. Aman karena kode ikut dibangun ke dalam image,
; dan setiap rilis menghasilkan container baru.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
