; nginx dan php-fpm dijalankan berdampingan dalam satu container.
; Bila salah satu mati, supervisord menghentikan seluruh container agar
; orkestrator (compose/k8s) yang memutuskan restart — bukan diam-diam
; berjalan setengah hidup.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
command=sh -c 'printf "READY\n"; while read line; do kill -SIGQUIT $PPID; printf "RESULT 2\nOK"; done'
